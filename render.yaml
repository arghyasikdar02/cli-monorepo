services:
  - type: web
    name: cyberlabin-api
    runtime: node
    rootDir: cyberscout-server
    plan: starter
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://cyberlabin.com
      - key: BACKEND_URL
        value: https://cyberlabin.onrender.com
      - key: CORS_ORIGINS
        value: https://cyberlabin.com
      - key: GOOGLE_CLOUD_PROJECT_ID
        value: cyber-lab-in
      - key: GOOGLE_CLOUD_PROJECT_NUMBER
        value: "854487433792"
      - key: GOOGLE_CLIENT_ID
        value: 854487433792-1ntj74qq2qta3fei0a7qhhj650n2p5cv.apps.googleusercontent.com
      - key: GOOGLE_REDIRECT_URI
        value: https://cyberlabin.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: BCRYPT_COST
        value: "12"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: JWT_SECRET
        sync: false
      - key: VISITOR_HASH_SALT
        sync: false
      - key: LAB_FLAG_SALT
        sync: false
      - key: CLIADM_ADMIN_TOKEN
        sync: false

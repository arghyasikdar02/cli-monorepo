services:
  - type: web
    name: cyberlabin-api
    runtime: node
    rootDir: cyberscout-server
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: cyberlabin-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: FRONTEND_URL
        value: https://cyberlabin.com
      - key: BACKEND_URL
        value: https://cyberlabin.onrender.com
      - key: CORS_ORIGINS
        value: https://cyberlabin.com,https://www.cyberlabin.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: BCRYPT_COST
        value: "12"
      - key: DATABASE_PATH
        value: /var/data/cyberlab.sqlite
      - key: SEED_BASELINE_FORCE
        value: "0"
      - key: JWT_SECRET
        sync: false
      - key: VISITOR_HASH_SALT
        sync: false
      - key: LAB_FLAG_SALT
        sync: false
      - key: CLIADM_ADMIN_TOKEN
        sync: false

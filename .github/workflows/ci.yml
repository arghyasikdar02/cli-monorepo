name: Cyber Lab IN CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyberlabin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cyberlabin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cyberlabin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            cyberscout/package-lock.json
            cyberscout-server/package-lock.json
      - name: Install frontend
        run: npm ci --prefix cyberscout
      - name: Install backend
        run: npm ci --prefix cyberscout-server
      - name: Lint and static analysis
        run: npm run lint
      - name: Integration tests
        run: npm test
      - name: Production build and public-route prerender
        run: npm run build

name: Cyber Lab IN CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: |
            cyberscout/package-lock.json
            cyberscout-server/package-lock.json
      - name: Install frontend
        run: npm ci --prefix cyberscout
      - name: Install backend
        run: npm ci --prefix cyberscout-server
      - name: Lint and static analysis
        run: npm run lint
      - name: Integration tests
        run: npm test
      - name: Production build and public-route prerender
        run: npm run build
